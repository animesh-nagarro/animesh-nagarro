# Reference upstream Argo CD install manifests
# Source: https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
# For brevity, include upstream file or Helm-based installation.
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-server
  namespace: argocd
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
  namespace: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-server
    spec:
      serviceAccountName: argocd-server
      containers:
      - name: argocd-server
        image: quay.io/argoproj/argocd:v2.10.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: server
        - containerPort: 8083
          name: metrics
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
        args:
          - "argocd-server"